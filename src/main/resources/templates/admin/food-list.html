<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食品マスタ管理 - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-section { font-size: 11px; color: #666; padding: 8px 20px; margin-top: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #f59e0b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: bold; }
        .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; }
        .btn-primary { background: #1a1a2e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .table-section { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .table-toolbar h2 { font-size: 16px; font-weight: bold; }
        .search-box { display: flex; gap: 8px; }
        .search-input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; width: 200px; }
        .btn-search { background: #1a1a2e; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 13px; color: #888; padding: 8px 12px; border-bottom: 1px solid #eee; }
        td { padding: 14px 12px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        .btn-edit { border: 1px solid #ddd; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #555; text-decoration: none; background: white; display: inline-block; }
        .btn-delete { border: none; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: white; background: #e53935; display: inline-block; }
        .empty { text-align: center; padding: 40px; color: #aaa; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/meals}" class="nav-item">🏠 ダッシュボード</a>
        <div class="nav-section">管理者メニュー</div>
        <a th:href="@{/admin/food}" class="nav-item active">🍽 食品マスタ管理</a>
        <a th:href="@{/admin/users}" class="nav-item">👥 ユーザー管理</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div>
            <div class="user-name">管理者</div>
            <div class="user-role">Administrator</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="header">
        <div>
            <h1>食品マスタ管理</h1>
            <div class="subtitle">食品データベースの管理</div>
        </div>
        <a th:href="@{/admin/food/new}" class="btn-primary">＋ 食品を追加</a>
    </div>

    <div class="table-section">
        <div class="table-toolbar">
            <h2>食品一覧</h2>
            <form th:action="@{/admin/food}" method="get" class="search-box">
                <input type="text" name="keyword" class="search-input" placeholder="食品名で検索" th:value="${keyword}" />
                <button type="submit" class="btn-search">検索</button>
            </form>
        </div>
        <table>
            <thead>
            <tr>
                <th>食品名</th>
                <th>カロリー</th>
                <th>たんぱく質</th>
                <th>脂質</th>
                <th>炭水化物</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(foods)}">
                <td colspan="6" class="empty">食品データがありません</td>
            </tr>
            <tr th:each="food : ${foods}">
                <td th:text="${food.foodName}"></td>
                <td th:text="${food.calories != null ? food.calories + ' kcal' : '-'}"></td>
                <td th:text="${food.proteinG != null ? food.proteinG + 'g' : '-'}"></td>
                <td th:text="${food.fatG != null ? food.fatG + 'g' : '-'}"></td>
                <td th:text="${food.carbsG != null ? food.carbsG + 'g' : '-'}"></td>
                <td>
                    <a th:href="@{/admin/food/edit/{id}(id=${food.id})}" class="btn-edit">編集</a>
                    <form th:action="@{/admin/food/delete/{id}(id=${food.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-delete">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
