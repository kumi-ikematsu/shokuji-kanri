<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザーを編集 - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-section { font-size: 11px; color: #666; padding: 8px 20px; margin-top: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar-side { width: 32px; height: 32px; background: #f59e0b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
        .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 700px; }
        .user-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #eee; }
        .user-avatar-large { width: 56px; height: 56px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; }
        .user-info-header .name { font-size: 18px; font-weight: bold; }
        .user-info-header .id { font-size: 13px; color: #888; margin-top: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus { border-color: #1a1a2e; }
        .form-input-disabled { width: 100%; padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; background: #f9f9f9; color: #aaa; }
        .btn-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: space-between; }
        .btn-left { display: flex; gap: 12px; }
        .btn-submit { background: #1a1a2e; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: white; color: #555; border: 1px solid #ddd; padding: 12px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-delete { background: white; color: #e53935; border: 1px solid #ffcdd2; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/meals}" class="nav-item">🏠 ダッシュボード</a>
        <div class="nav-section">管理者メニュー</div>
        <a th:href="@{/admin/food}" class="nav-item">🍽 食品マスタ管理</a>
        <a th:href="@{/admin/users}" class="nav-item active">👥 ユーザー管理</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar-side">A</div>
        <div>
            <div class="user-name">管理者</div>
            <div class="user-role">Administrator</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="page-title">ユーザーを編集</div>
    <div class="page-subtitle">ユーザー情報を修正します</div>

    <div class="form-card">
        <div class="user-header">
            <div class="user-avatar-large" th:text="${user.username.substring(0,1)}">U</div>
            <div class="user-info-header">
                <div class="name" th:text="${user.username}"></div>
                <div class="id" th:text="'ID: ' + ${user.id}"></div>
            </div>
        </div>

        <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" method="post">
            <div class="form-group">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-input" th:value="${user.username}" required />
            </div>
            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="email" class="form-input" th:value="${user.email}" required />
            </div>
            <div class="form-group">
                <label class="form-label">ユーザーID（変更不可）</label>
                <div class="form-input-disabled" th:text="'user_' + ${user.id}"></div>
            </div>

            <div class="btn-actions">
                <div class="btn-left">
                    <button type="submit" class="btn-submit">保存する</button>
                    <a th:href="@{/admin/users}" class="btn-cancel">キャンセル</a>
                </div>
                <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post">
                    <button type="submit" class="btn-delete">🗑 このユーザーを削除</button>
                </form>
            </div>
        </form>
    </div>
</div>
</body>
</html>
