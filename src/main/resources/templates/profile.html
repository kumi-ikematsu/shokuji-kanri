<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プロフィール - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
        .success-banner { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #15803d; margin-bottom: 24px; }
        .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 600px; }
        .user-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #eee; }
        .user-avatar-large { width: 64px; height: 64px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #1a1a2e; }
        .user-info-name { font-size: 20px; font-weight: bold; }
        .user-info-email { font-size: 14px; color: #888; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus { border-color: #1a1a2e; }
        .form-input-disabled { width: 100%; padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; background: #f9f9f9; color: #aaa; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn-submit { background: #1a1a2e; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: white; color: #e53935; border: 1px solid #ffcdd2; padding: 12px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/meals}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item active">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar" th:text="${user.username.substring(0,1)}">U</div>
        <div>
            <div class="user-name" th:text="${user.username}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="page-title">プロフィール</div>
    <div class="page-subtitle">アカウント情報を管理します</div>

    <div th:if="${success}" class="success-banner" th:text="${success}"></div>

    <div class="form-card">
        <div class="user-header">
            <div class="user-avatar-large" th:text="${user.username.substring(0,1)}">U</div>
            <div>
                <div class="user-info-name" th:text="${user.username}"></div>
                <div class="user-info-email" th:text="${user.email}"></div>
            </div>
        </div>

        <form th:action="@{/profile}" method="post">
            <div class="form-group">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-input" th:value="${user.username}" required />
            </div>
            <div class="form-group">
                <label class="form-label">メールアドレス（変更不可）</label>
                <div class="form-input-disabled" th:text="${user.email}"></div>
            </div>
            <div class="form-row form-group">
                <div>
                    <label class="form-label">身長 (cm)</label>
                    <input type="number" name="heightCm" class="form-input" th:value="${user.heightCm}" step="0.1" placeholder="170" />
                </div>
                <div>
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" name="weightKg" class="form-input" th:value="${user.weightKg}" step="0.1" placeholder="65" />
                </div>
            </div>
            <div class="btn-actions">
                <button type="submit" class="btn-submit">保存する</button>
                <a th:href="@{/logout}" class="btn-logout">ログアウト</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
