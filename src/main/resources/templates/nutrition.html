<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>栄養サマリー - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: bold; }
        .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; }
        .total-card { background: #1a1a2e; color: white; border-radius: 12px; padding: 28px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .total-label { font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .total-value { font-size: 42px; font-weight: bold; }
        .total-value span { font-size: 18px; font-weight: normal; color: #aaa; margin-left: 4px; }
        .total-target { font-size: 13px; color: #4ade80; margin-top: 8px; }
        .total-date { font-size: 14px; color: #aaa; }
        .nutrition-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .nutrition-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-value { font-size: 28px; font-weight: bold; }
        .card-unit { font-size: 14px; font-weight: normal; color: #888; margin-left: 2px; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .chart-title { font-size: 15px; font-weight: bold; margin-bottom: 16px; }
        .progress-item { margin-bottom: 14px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; }
        .fill-blue { background: #3b82f6; }
        .fill-orange { background: #f59e0b; }
        .fill-green { background: #10b981; }
        .fill-red { background: #ef4444; }
        .meal-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-朝食 { background: #f59e0b; }
        .dot-昼食 { background: #3b82f6; }
        .dot-夕食 { background: #ef4444; }
        .dot-間食 { background: #8b5cf6; }
        .empty { text-align: center; padding: 20px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item active">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <div>
            <div class="user-name" th:text="${#authentication.name}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="header">
        <h1>栄養サマリー</h1>
        <div class="subtitle">栄養バランスを確認しましょう</div>
    </div>

    <div class="total-card">
        <div>
            <div class="total-label">合計カロリー</div>
            <div class="total-value" th:text="${totalCalories}">0<span>kcal</span></div>
            <div class="total-target">目標 2,000 kcal まで残り <span th:text="${2000 - totalCalories}">2000</span> kcal</div>
        </div>
        <div class="total-date" th:text="${#temporals.format(#temporals.createNow(), 'yyyy年MM月dd日')}"></div>
    </div>

    <div class="nutrition-cards">
        <div class="nutrition-card">
            <div class="card-label">たんぱく質</div>
            <div class="card-value"><span th:text="${totalProtein}">0</span><span class="card-unit">g</span></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">脂質</div>
            <div class="card-value"><span th:text="${totalFat}">0</span><span class="card-unit">g</span></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">炭水化物</div>
            <div class="card-value"><span th:text="${totalCarbs}">0</span><span class="card-unit">g</span></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">食事回数</div>
            <div class="card-value"><span th:text="${mealCount}">0</span><span class="card-unit">回</span></div>
        </div>
    </div>

    <div class="charts-row">
        <div class="chart-card">
            <div class="chart-title">栄養バランス（対目標）</div>
            <div class="progress-item">
                <div class="progress-label"><span>たんぱく質</span><span th:text="${totalProtein} + ' / 80g'"></span></div>
                <div class="progress-bar"><div class="progress-fill fill-blue" th:style="'width:' + ${totalProtein / 80 * 100 > 100 ? 100 : totalProtein / 80 * 100} + '%'"></div></div>
            </div>
            <div class="progress-item">
                <div class="progress-label"><span>脂質</span><span th:text="${totalFat} + ' / 65g'"></span></div>
                <div class="progress-bar"><div class="progress-fill fill-orange" th:style="'width:' + ${totalFat / 65 * 100 > 100 ? 100 : totalFat / 65 * 100} + '%'"></div></div>
            </div>
            <div class="progress-item">
                <div class="progress-label"><span>炭水化物</span><span th:text="${totalCarbs} + ' / 260g'"></span></div>
                <div class="progress-bar"><div class="progress-fill fill-green" th:style="'width:' + ${totalCarbs / 260 * 100 > 100 ? 100 : totalCarbs / 260 * 100} + '%'"></div></div>
            </div>
            <div class="progress-item">
                <div class="progress-label"><span>カロリー</span><span th:text="${totalCalories} + ' / 2000kcal'"></span></div>
                <div class="progress-bar"><div class="progress-fill fill-red" th:style="'width:' + ${totalCalories / 2000 * 100 > 100 ? 100 : totalCalories / 2000 * 100} + '%'"></div></div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-title">食事区分別カロリー</div>
            <div th:if="${#lists.isEmpty(meals)}" class="empty">食事記録がありません</div>
            <div th:each="meal : ${meals}" class="meal-item">
                <div>
                    <span class="dot" th:classappend="'dot-' + ${meal.mealType}"></span>
                    <span th:text="${meal.mealType}"></span>
                    <span style="color:#888;margin-left:8px;font-size:13px;" th:text="${meal.foodName}"></span>
                </div>
                <div th:text="${meal.calories != null ? meal.calories + ' kcal' : '-'}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
