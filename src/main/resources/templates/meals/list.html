<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ダッシュボード - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: bold; }
        .header .date { font-size: 13px; color: #888; margin-top: 4px; }
        .btn-primary { background: #1a1a2e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-ai { background: #4ade80; color: #1a1a2e; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; font-weight: bold; }
        .nutrition-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .nutrition-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-value { font-size: 28px; font-weight: bold; }
        .card-unit { font-size: 14px; font-weight: normal; color: #888; margin-left: 2px; }
        .card-target { font-size: 12px; color: #4ade80; margin-top: 4px; }
        .table-section { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .table-header h2 { font-size: 16px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 13px; color: #888; padding: 8px 12px; border-bottom: 1px solid #eee; }
        td { padding: 14px 12px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-朝食 { background: #fff3e0; color: #f57c00; }
        .badge-昼食 { background: #e3f2fd; color: #1976d2; }
        .badge-夕食 { background: #fce4ec; color: #c62828; }
        .badge-間食 { background: #f3e5f5; color: #7b1fa2; }
        .btn-edit { border: 1px solid #ddd; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #555; text-decoration: none; background: white; display: inline-block; }
        .btn-edit:hover { background: #f5f5f5; }
        .empty { text-align: center; padding: 40px; color: #aaa; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item active">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <div>
            <div class="user-name" th:text="${#authentication.name}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>
<div class="main">
    <div class="header">
        <div>
            <h1>ダッシュボード</h1>
            <div class="date" th:text="${#temporals.format(#temporals.createNow(), 'yyyy年MM月dd日')}"></div>
        </div>
        <div style="display:flex;gap:10px;">
            <a th:href="@{/photo/upload}" class="btn-ai">📸 AI解析</a>
            <a th:href="@{/meals/new}" class="btn-primary">＋ 食事を記録</a>
        </div>
    </div>
    <div class="nutrition-cards">
        <div class="nutrition-card">
            <div class="card-label">今日の摂取カロリー</div>
            <div class="card-value"><span th:text="${totalCalories}">0</span><span class="card-unit">kcal</span></div>
            <div class="card-target" th:text="'目標まで ' + ${2000 - totalCalories} + ' kcal'"></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">たんぱく質</div>
            <div class="card-value"><span th:text="${totalProtein}">0</span><span class="card-unit">g</span></div>
            <div class="card-target" th:text="'目標 80g'"></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">脂質</div>
            <div class="card-value"><span th:text="${totalFat}">0</span><span class="card-unit">g</span></div>
            <div class="card-target" th:text="'目標 65g'"></div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">炭水化物</div>
            <div class="card-value"><span th:text="${totalCarbs}">0</span><span class="card-unit">g</span></div>
            <div class="card-target" th:text="'目標 260g'"></div>
        </div>
    </div>
    <div class="table-section">
        <div class="table-header">
            <h2>今日の食事記録</h2>
            <a th:href="@{/meals/new}" class="btn-edit">＋ 追加</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>食事区分</th><th>食品名</th><th>カロリー</th><th>たんぱく質</th><th>脂質</th><th>炭水化物</th><th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(meals)}">
                <td colspan="7" class="empty">食事記録がありません</td>
            </tr>
            <tr th:each="meal : ${meals}">
                <td><span class="badge" th:classappend="'badge-' + ${meal.mealType}" th:text="${meal.mealType}"></span></td>
                <td th:text="${meal.foodName}"></td>
                <td th:text="${meal.calories != null ? meal.calories + ' kcal' : '-'}"></td>
                <td th:text="${meal.proteinG != null ? meal.proteinG + 'g' : '-'}"></td>
                <td th:text="${meal.fatG != null ? meal.fatG + 'g' : '-'}"></td>
                <td th:text="${meal.carbsG != null ? meal.carbsG + 'g' : '-'}"></td>
                <td>
                    <a th:href="@{/meals/edit/{id}(id=${meal.id})}" class="btn-edit">編集</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <br><a th:href="@{/logout}" style="color:#888;font-size:13px;">ログアウト</a>
</div>
</body>
</html>
