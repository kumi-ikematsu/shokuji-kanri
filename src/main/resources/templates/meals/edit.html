<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食事記録を編集 - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
        .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 700px; }
        .meal-type-group { display: flex; gap: 8px; margin-bottom: 24px; }
        .meal-type-btn { padding: 8px 20px; border-radius: 8px; border: 1px solid #ddd; background: white; font-size: 14px; cursor: pointer; color: #555; }
        .meal-type-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus { border-color: #1a1a2e; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .btn-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: space-between; }
        .btn-left { display: flex; gap: 12px; }
        .btn-submit { background: #1a1a2e; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #2a2a4e; }
        .btn-cancel { background: white; color: #555; border: 1px solid #ddd; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-delete { background: white; color: #e53935; border: 1px solid #ffcdd2; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #fff3f3; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item active">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <div>
            <div class="user-name" th:text="${#authentication.name}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="page-title">食事記録を編集</div>
    <div class="page-subtitle">記録を修正・削除できます</div>

    <div class="form-card">
        <form th:action="@{/meals/edit/{id}(id=${meal.id})}" method="post">
            <div class="form-group">
                <label class="form-label">食事区分</label>
                <div class="meal-type-group">
                    <button type="button" class="meal-type-btn"
                            th:classappend="${meal.mealType == '朝食'} ? ' active'"
                            onclick="selectMealType(this, '朝食')">朝食</button>
                    <button type="button" class="meal-type-btn"
                            th:classappend="${meal.mealType == '昼食'} ? ' active'"
                            onclick="selectMealType(this, '昼食')">昼食</button>
                    <button type="button" class="meal-type-btn"
                            th:classappend="${meal.mealType == '夕食'} ? ' active'"
                            onclick="selectMealType(this, '夕食')">夕食</button>
                    <button type="button" class="meal-type-btn"
                            th:classappend="${meal.mealType == '間食'} ? ' active'"
                            onclick="selectMealType(this, '間食')">間食</button>
                </div>
                <input type="hidden" name="mealType" id="mealTypeInput" th:value="${meal.mealType}" />
            </div>

            <div class="form-group">
                <label class="form-label">食品名</label>
                <input type="text" name="foodName" class="form-input" th:value="${meal.foodName}" required />
            </div>

            <div class="form-row form-group">
                <div>
                    <label class="form-label">カロリー (kcal)</label>
                    <input type="number" name="calories" class="form-input" th:value="${meal.calories}" step="0.1" />
                </div>
                <div>
                    <label class="form-label">日付</label>
                    <input type="date" name="mealDate" class="form-input" th:value="${meal.mealDate}" required />
                </div>
            </div>

            <div class="form-row-3 form-group">
                <div>
                    <label class="form-label">たんぱく質 (g)</label>
                    <input type="number" name="proteinG" class="form-input" th:value="${meal.proteinG}" step="0.1" />
                </div>
                <div>
                    <label class="form-label">脂質 (g)</label>
                    <input type="number" name="fatG" class="form-input" th:value="${meal.fatG}" step="0.1" />
                </div>
                <div>
                    <label class="form-label">炭水化物 (g)</label>
                    <input type="number" name="carbsG" class="form-input" th:value="${meal.carbsG}" step="0.1" />
                </div>
            </div>

            <div class="btn-actions">
                <div class="btn-left">
                    <button type="submit" class="btn-submit">保存する</button>
                    <a th:href="@{/meals}" class="btn-cancel">キャンセル</a>
                </div>
                <form th:action="@{/meals/delete/{id}(id=${meal.id})}" method="post">
                    <button type="submit" class="btn-delete">🗑 この記録を削除</button>
                </form>
            </div>
        </form>
    </div>
</div>

<script>
    function selectMealType(btn, type) {
        document.querySelectorAll('.meal-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mealTypeInput').value = type;
    }
</script>
</body>
</html>
