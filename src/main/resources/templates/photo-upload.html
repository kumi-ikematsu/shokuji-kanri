<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>料理写真をアップロード - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: bold; }
        .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; }
        .ai-badge { background: #dcfce7; color: #16a34a; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .info-banner { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #15803d; margin-bottom: 24px; }
        .error-banner { background: #fff3f3; border: 1px solid #ffcdd2; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #e53935; margin-bottom: 24px; }
        .upload-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); max-width: 700px; }
        .section-label { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .drop-zone { border: 2px dashed #ddd; border-radius: 12px; padding: 48px; text-align: center; cursor: pointer; }
        .drop-zone:hover { border-color: #4ade80; background: #f0fdf4; }
        .drop-icon { font-size: 48px; margin-bottom: 16px; }
        .drop-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .drop-subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
        .btn-file { background: #1a1a2e; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .preview-area { display: none; margin-top: 16px; text-align: center; }
        .preview-img { max-width: 300px; max-height: 300px; border-radius: 8px; border: 1px solid #eee; }
        .warning-banner { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #92400e; margin-top: 24px; }
        .btn-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn-submit { background: #1a1a2e; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
        .btn-cancel { background: white; color: #555; border: 1px solid #ddd; padding: 12px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; display: inline-block; }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading-text { font-size: 14px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item active">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <div>
            <div class="user-name" th:text="${#authentication.name}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="header">
        <h1>料理写真をアップロード <span class="ai-badge">AI機能</span></h1>
        <div class="subtitle">写真からAIが食品名・カロリー・栄養素を自動解析します</div>
    </div>

    <div class="info-banner">
        📸 料理全体が写るように撮影すると解析精度が上がります。JPEG・PNG形式、最大10MBまでアップロード可能です。
    </div>

    <div th:if="${error}" class="error-banner" th:text="${error}"></div>

    <div class="upload-card">
        <form id="uploadForm" th:action="@{/photo/analyze}" method="post" enctype="multipart/form-data">
            <div class="section-label">写真を選択</div>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('photoInput').click()">
                <div class="drop-icon">🖼️</div>
                <div class="drop-title">ここに写真をドラッグ＆ドロップ</div>
                <div class="drop-subtitle">または下のボタンから選択してください</div>
                <button type="button" class="btn-file">📁 ファイルを選択</button>
            </div>
            <input type="file" id="photoInput" name="photo" accept="image/*" style="display:none;" onchange="previewImage(this)" />

            <div class="preview-area" id="previewArea">
                <img id="previewImg" src="" alt="プレビュー" class="preview-img" />
            </div>

            <div class="warning-banner">
                ⚠️ 写真を選択すると「AI解析する」ボタンが有効になります。解析には数秒かかる場合があります。
            </div>

            <div class="loading" id="loadingArea">
                <div style="font-size:32px;">⏳</div>
                <div class="loading-text">AIが解析中です。しばらくお待ちください...</div>
            </div>

            <div class="btn-actions">
                <button type="submit" class="btn-submit" id="submitBtn" disabled>AI解析する（写真を選択してください）</button>
                <a th:href="@{/meals}" class="btn-cancel">キャンセル</a>
            </div>
        </form>
    </div>
</div>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewArea').style.display = 'block';
                const btn = document.getElementById('submitBtn');
                btn.disabled = false;
                btn.textContent = 'AI解析する';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', function() {
        document.getElementById('loadingArea').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#4ade80'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ddd'; });
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.style.borderColor = '#ddd';
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            document.getElementById('photoInput').files = files;
            previewImage(document.getElementById('photoInput'));
        }
    });
</script>
</body>
</html>
