<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録 - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; }

        .form-side {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background: white;
            overflow-y: auto;
        }
        .form-container { width: 100%; max-width: 380px; }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
        .logo-icon { width: 40px; height: 40px; background: #4ade80; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo-text { font-size: 18px; font-weight: bold; color: #1a1a2e; }
        h1 { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }

        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus { border-color: #1a1a2e; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .error-msg { background: #fff3f3; border: 1px solid #ffcdd2; color: #e53935; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }

        .btn-submit { width: 100%; background: #1a1a2e; color: white; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #2a2a4e; }

        .links { text-align: center; margin-top: 20px; }
        .links a { color: #1a1a2e; font-size: 13px; text-decoration: none; }
        .links a:hover { text-decoration: underline; }

        .dark-side {
            width: 50%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 48px;
        }
        .dark-icon { font-size: 64px; margin-bottom: 24px; }
        .dark-title { font-size: 28px; font-weight: bold; margin-bottom: 12px; }
        .dark-subtitle { font-size: 14px; color: #aaa; line-height: 1.6; }
    </style>
</head>
<body>
<div class="form-side">
    <div class="form-container">
        <div class="logo">
            <div class="logo-icon">🍱</div>
            <span class="logo-text">食事記録アプリ</span>
        </div>

        <h1>新規登録</h1>
        <p class="subtitle">アカウントを作成してください</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-input" placeholder="山田 太郎" required />
            </div>
            <div class="form-group">
                <label class="form-label">メールアドレス</label>
                <input type="email" name="email" class="form-input" placeholder="user@example.com" required />
            </div>
            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required />
            </div>
            <div class="form-row form-group">
                <div>
                    <label class="form-label">身長 (cm)</label>
                    <input type="number" name="heightCm" class="form-input" placeholder="170" step="0.1" />
                </div>
                <div>
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" name="weightKg" class="form-input" placeholder="65" step="0.1" />
                </div>
            </div>
            <button type="submit" class="btn-submit">次へ →</button>
        </form>

        <div class="links">
            <a th:href="@{/login}">← ログインに戻る</a>
        </div>
    </div>
</div>

<div class="dark-side">
    <div class="dark-icon">👤</div>
    <div class="dark-title">アカウントを<br>作成しましょう</div>
    <div class="dark-subtitle">基本情報を入力して<br>健康管理を始めましょう</div>
</div>
</body>
</html>
