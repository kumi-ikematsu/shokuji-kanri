<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI解析結果 - 食事記録アプリ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 200px; background: #1a1a2e; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 24px; border-bottom: 1px solid #333; }
        .sidebar-logo span { font-size: 16px; font-weight: bold; }
        .logo-icon { width: 32px; height: 32px; background: #4ade80; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background: #2a2a4e; color: white; }
        .nav-item.active { border-left: 3px solid #4ade80; color: white; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #1a1a2e; }
        .user-name { font-size: 13px; font-weight: bold; color: white; }
        .user-role { font-size: 11px; color: #aaa; }
        .main { flex: 1; overflow-y: auto; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: bold; }
        .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; }
        .ai-badge { background: #dcfce7; color: #16a34a; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .header-btns { display: flex; gap: 10px; }
        .btn-outline { border: 1px solid #ddd; background: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; color: #555; display: inline-block; }

        /* 栄養カード */
        .nutrition-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .nutrition-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-sub { font-size: 11px; color: #4ade80; margin-top: 4px; }
        .card-value { font-size: 28px; font-weight: bold; }
        .card-unit { font-size: 14px; font-weight: normal; color: #888; margin-left: 2px; }

        /* AI精度 */
        .accuracy-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px; }
        .accuracy-label { font-size: 13px; color: #555; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .accuracy-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .accuracy-fill { height: 100%; background: #4ade80; border-radius: 5px; width: 87%; }
        .accuracy-note { font-size: 12px; color: #888; margin-top: 8px; }

        /* フォーム */
        .form-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .form-title { font-size: 15px; font-weight: bold; margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #4ade80; border-radius: 8px; font-size: 14px; outline: none; background: #f0fdf4; }
        .form-input:focus { border-color: #16a34a; }
        .ai-note { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px; font-size: 12px; color: #15803d; margin-bottom: 20px; }

        /* 画像 */
        .image-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .image-card img { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; }
        .image-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .analyzed-badge { background: #dcfce7; color: #16a34a; font-size: 11px; padding: 3px 8px; border-radius: 10px; display: inline-block; margin-top: 8px; }

        .content-row { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }

        .btn-submit { background: #4ade80; color: #1a1a2e; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #22c55e; }
        .btn-cancel { background: white; color: #555; border: 1px solid #ddd; padding: 12px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-actions { display: flex; gap: 12px; margin-top: 20px; }

        .meal-type-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .meal-type-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; background: white; font-size: 13px; cursor: pointer; color: #555; }
        .meal-type-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">🍱</div>
        <span>食事記録</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item">🏠 ダッシュボード</a>
        <a th:href="@{/meals}" class="nav-item active">🍽 食事記録</a>
        <a th:href="@{/nutrition}" class="nav-item">📊 栄養サマリー</a>
        <a th:href="@{/profile}" class="nav-item">👤 プロフィール</a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <div>
            <div class="user-name" th:text="${#authentication.name}">ユーザー</div>
            <div class="user-role">一般ユーザー</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="header">
        <div>
            <h1>AI解析結果の確認 <span class="ai-badge">AI解析完了</span></h1>
            <div class="subtitle">内容を確認・修正してから記録してください</div>
        </div>
        <div class="header-btns">
            <a th:href="@{/photo/upload}" class="btn-outline">← 撮り直す</a>
        </div>
    </div>

    <!-- 栄養カード -->
    <div class="nutrition-cards">
        <div class="nutrition-card">
            <div class="card-label">カロリー</div>
            <div class="card-value"><span th:text="${calories}">0</span><span class="card-unit">kcal</span></div>
            <div class="card-sub">AI推定値</div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">たんぱく質</div>
            <div class="card-value"><span th:text="${proteinG}">0</span><span class="card-unit">g</span></div>
            <div class="card-sub">AI推定値</div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">脂質</div>
            <div class="card-value"><span th:text="${fatG}">0</span><span class="card-unit">g</span></div>
            <div class="card-sub">AI推定値</div>
        </div>
        <div class="nutrition-card">
            <div class="card-label">炭水化物</div>
            <div class="card-value"><span th:text="${carbsG}">0</span><span class="card-unit">g</span></div>
            <div class="card-sub">AI推定値</div>
        </div>
    </div>

    <!-- AI精度バー -->
    <div class="accuracy-card">
        <div class="accuracy-label"><span>🤖 AI解析精度</span><span>87%</span></div>
        <div class="accuracy-bar"><div class="accuracy-fill"></div></div>
        <div class="accuracy-note">内容が違う場合は各項目を修正してください。修正後は解析精度の表示が変わります。</div>
    </div>

    <!-- メインコンテンツ -->
    <div class="content-row">
        <div class="form-card">
            <div class="form-title">解析結果の確認・修正</div>
            <div class="ai-note">🟢 緑色の入力欄はAIが自動入力した値です。内容が違う場合はクリックして修正できます。</div>

            <form th:action="@{/photo/save}" method="post">
                <div class="form-group">
                    <label class="form-label">食事区分</label>
                    <div class="meal-type-group">
                        <button type="button" class="meal-type-btn active" onclick="selectMealType(this, '朝食')">朝食</button>
                        <button type="button" class="meal-type-btn" onclick="selectMealType(this, '昼食')">昼食</button>
                        <button type="button" class="meal-type-btn" onclick="selectMealType(this, '夕食')">夕食</button>
                        <button type="button" class="meal-type-btn" onclick="selectMealType(this, '間食')">間食</button>
                    </div>
                    <input type="hidden" name="mealType" id="mealTypeInput" value="朝食" />
                </div>

                <div class="form-group">
                    <label class="form-label">食品名</label>
                    <input type="text" name="foodName" class="form-input" th:value="${foodName}" required />
